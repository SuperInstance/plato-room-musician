[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plato-room-musician"
version = "0.1.0"
description = "Turns PLATO room activity into music — every room is a musician"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Forgemaster", email = "forgemaster@superinstance.ai"},
]

dependencies = [
    "flux-tensor-midi",
    "numpy>=1.24",
    "mido>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["plato_room_musician*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
